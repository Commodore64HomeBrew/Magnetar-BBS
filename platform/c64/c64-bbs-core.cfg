# C64 TCP core linker map:
#   $0801-$A20F  MAIN + LOWBSS
#   $A210-$A27F  RESAPI fixed JMP stubs (66 B)
#   $A280-$A59F  SHARED data
#   $A5A0-$ABFF  BSSHI / stack gap
#   $AC00-$AFFF  stack
#   $B000+       bank overlays
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = export, value = $0400;
    __HIMEM__:     type = export, value = $B000;
    __BBS_API_BASE__: type = export, value = $A210;
    __BBS_SHARED_BASE__: type = export, value = $A280;
    __BBS_SHARED_SIZE__: type = export, value = $0320;
}
MEMORY {
    ZP:        file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR:  file = %O,               start = %S - 2,          size = $0002;
    HEADER:    file = %O, define = yes, start = %S,              size = $000D;
    MAIN:      file = %O, define = yes, start = __HEADER_LAST__, size = __BBS_API_BASE__ - __HEADER_LAST__;
    RESAPI:    file = %O,               start = __BBS_API_BASE__, size = __BBS_SHARED_BASE__ - __BBS_API_BASE__;
    BSS:       file = "",               start = __ONCE_RUN__,    size = __BBS_API_BASE__ - __ONCE_RUN__;
    SHARED:    file = "",               start = __BBS_SHARED_BASE__, size = __BBS_SHARED_SIZE__;
    BSSHI:     file = "",               start = __BBS_SHARED_BASE__ + __BBS_SHARED_SIZE__,
                                       size = __HIMEM__ - __STACKSIZE__ - (__BBS_SHARED_BASE__ + __BBS_SHARED_SIZE__);
}
SEGMENTS {
    ZEROPAGE:  load = ZP,        type = zp;
    LOADADDR:  load = LOADADDR,  type = ro;
    EXEHDR:    load = HEADER,    type = ro;
    STARTUP:   load = MAIN,      type = ro;
    LOWCODE:   load = MAIN,      type = ro,  optional = yes;
    CODE:      load = MAIN,      type = ro;
    RODATA:    load = MAIN,      type = ro;
    DATA:      load = MAIN,      type = rw;
    INIT:      load = MAIN,      type = rw;
    ONCE:      load = MAIN,      type = ro,  define   = yes;
    LOWBSS:    load = BSS,       type = bss, optional = yes;
    RESAPI:    load = RESAPI,    type = ro;
    BSS:       load = BSSHI,     type = bss, define   = yes;
    SHARED:    load = SHARED,    type = bss,            optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
