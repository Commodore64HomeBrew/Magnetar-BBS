# Bank overlay link map: code/BSS at $B000, stack $CE00-$CFFF (7680 B RAM).
# Must match BBS_BANK_BASE / BBS_BANK_RAM_SIZE in bbs-bank.h and __HIMEM__ in core cfg.
FEATURES {
    STARTADDRESS: default = $B000;
}
SYMBOLS {
    __STACKSIZE__: type = export, value = $0200;
    __BANKMEMTOP__: type = export, value = $D000;
}
MEMORY {
    ZP:     file = "",   define = yes, start = $0002, size = $001A;
    RAM:    file = %O,   define = yes, start = $B000, size = __BANKMEMTOP__ - __STACKSIZE__ - $B000;
    STACK:  file = "",   define = yes, start = __BANKMEMTOP__ - __STACKSIZE__, size = __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BANKHDR:  load = RAM,     type = ro,  define = yes, start = $B000;
    CODE:     load = RAM,     type = ro;
    RODATA:   load = RAM,     type = ro;
    DATA:     load = RAM,     type = rw;
    BSS:      load = RAM,     type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor,
            label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
}
